{% for field in fields %}<div class="form-field {% if field.name == 'is_second_hand' %}field-checkbox{% endif %} {% if field.name == 'opening_quantity' %}opening-stock-field{% endif %}"{% if field.name == 'opening_quantity' %} id="opening-stock-field"{% endif %}><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</div>{% endfor %}
