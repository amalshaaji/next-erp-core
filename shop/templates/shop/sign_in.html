{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Next</title><link rel="icon" type="image/png" href="{% static 'shop/favicon.png' %}?v=27613e58122e"><link rel="stylesheet" href="{% static 'shop/shop.css' %}?v=20261120-7"></head>
<body class="signin-page"><main class="signin-card"><a class="brand brand-centered" href="#"><img class="brand-logo" src="{% static 'shop/favicon.png' %}?v=27613e58122e" width="36" height="36" alt=""><span>Next<small>Mobile shop ERP</small></span></a><div class="signin-copy"><h1>Welcome back</h1><p>Sign in to manage your shop.</p></div>
{% if clerk_frontend_api_url and clerk_publishable_key %}<div id="clerk-sign-in"></div><script defer crossorigin="anonymous" src="https://{{ clerk_frontend_api_url }}/npm/@clerk/ui@1/dist/ui.browser.js"></script><script defer crossorigin="anonymous" data-clerk-publishable-key="{{ clerk_publishable_key }}" src="https://{{ clerk_frontend_api_url }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script><script>window.addEventListener('load',async()=>{const mount=document.getElementById('clerk-sign-in');try{if(!window.Clerk)throw new Error('ClerkJS did not load. Check the publishable key, Frontend API hostname, and browser network access.');await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor},signInUrl:'/sign-in/',afterSignInUrl:'/'});Clerk.mountSignIn(mount,{fallbackRedirectUrl:'/'});}catch(error){console.error('Clerk sign-in initialization failed:',error);mount.innerHTML='<div class="notice notice-warning"><strong>Sign-in could not load.</strong><p>Check your Clerk Development API keys, Frontend API hostname, and internet connection, then refresh.</p></div>';}});</script>
{% else %}<div class="notice notice-warning"><strong>Clerk is not configured yet.</strong><p>Add your Clerk publishable key and frontend API URL to <code>.env</code>, then restart the server.</p></div>{% endif %}
</main></body></html>
