{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Next</title><link rel="icon" type="image/png" href="{% static 'shop/favicon.png' %}"><link rel="stylesheet" href="{% static 'shop/shop.css' %}"></head>
<body class="signin-page"><main class="signin-card"><a class="brand brand-centered" href="#"><img class="brand-logo" src="{% static 'shop/favicon.png' %}" width="36" height="36" alt=""><span>Next<small>Mobile shop ERP</small></span></a><div class="signin-copy"><h1>Welcome back</h1><p>Sign in to manage your shop.</p></div>
<form id="sign-in-form" class="signin-form"><label for="email">Email<input id="email" type="email" autocomplete="username" placeholder="you@example.com" required></label><label for="password">Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><button class="button button-primary button-wide" type="submit">Sign in</button><p id="error" class="notice notice-warning" hidden></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabase = window.supabase.createClient('{{ supabase_url }}','{{ supabase_anon_key }}');
document.getElementById('sign-in-form').addEventListener('submit', async (event) => { event.preventDefault(); const error = document.getElementById('error'); error.hidden = true; const {data, error: authError} = await supabase.auth.signInWithPassword({email: email.value, password: password.value}); if (authError) { error.textContent = authError.message; error.hidden = false; return; } const body = new URLSearchParams({access_token: data.session.access_token}); const response = await fetch('{% url "auth_session" %}', {method:'POST', body}); if (response.ok) window.location.href = '/'; else { error.textContent = 'Could not establish a secure session.'; error.hidden = false; } });
</script></body></html>
